services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: home_drive
    volumes:
      - postgres_data:/var/lib/postgresql/data
  homedrive:
    image: home-drive:1.0.0-SNAPSHOT
    container_name: home-drive
    restart: no
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PASSWORD: test1234
      TOKEN_KEY: test1234
      DATA_LOCATION: /var/lib/home-drive/data
    volumes:
      - C:\Users\sambr\data:/var/lib/home-drive/data

volumes:
  postgres_data:
